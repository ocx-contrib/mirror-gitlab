#:schema https://ocx.sh/schemas/project/v1.json
# OCX project toolchain for the mirror-gitlab sibling repo.
#
# `uv` is the runtime for the PEP 723 generator script that produces the
# `url_index` (`cli/scripts/generate.py`). It is pinned to the NAMESPACED
# `ocx.sh/astral-sh/uv:0` — the flat `ocx.sh/uv:0` this repo used before is
# forbidden in new work: `mirror-uv` is slated for deletion and that coordinate
# dies with the `ocx.sh` host, which would leave the generator with no runtime.

[tools]
task = "ocx.sh/go-task/task:3.53.1"
cli = "ocx.sh/ocx/cli:0.6"
mirror = "ocx.sh/ocx/mirror:0.6"
uv = "ocx.sh/astral-sh/uv:0"

[group.lint.tools]
uv = "ocx.sh/astral-sh/uv:0.13.0"
grim = "ocx.sh/grimoire/cli:0.14.3"
actionlint = "ocx.sh/actionlint/actionlint:1.7.12"
gitleaks = "ocx.sh/gitleaks/gitleaks:8.30.1"
prek = "ocx.sh/prek/prek:0.5.5"

[group.release.tools]
git-cliff = "ocx.sh/git-cliff/git-cliff:2.14.2"
